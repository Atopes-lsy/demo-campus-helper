server:
  port: 8080

spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_helper?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8
    # Credentials come from the environment (.env locally, container env vars under compose).
    # No default here on purpose: a fallback would silently reintroduce a committed password.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: campus-order-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.campus.helper.event
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 3s
    socket-timeout: 30s
  task:
    scheduling:
      # @Scheduled shares one thread by default. Outbox delivery waits up to 10s per row on a
      # Kafka send, which would otherwise hold up the per-minute timeout scan behind it.
      # The WebSocket heartbeat runs on its own scheduler and is not affected.
      pool:
        size: 4

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:sk-placeholder}
    url: https://api.deepseek.com/v1

dispatch:
  max-radius: 3000
  min-score-threshold: 0.3
  retry-interval: 600

order:
  timeout:
    pending-minutes: 30
    delivered-hours: 2

anomaly:
  ghost-runner-hours: 2
  high-cancel-rate: 0.30
  slow-delivery-multiplier: 2.0

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: 12
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    # Optional BCrypt hash. When set it takes precedence over the plaintext password above.
    password-hash: ${ADMIN_PASSWORD_HASH:}

payment:
  callback-secret: ${PAYMENT_CALLBACK_SECRET}

outbox:
  publish-interval-ms: 1000
  batch-size: 50
  max-retries: 10
